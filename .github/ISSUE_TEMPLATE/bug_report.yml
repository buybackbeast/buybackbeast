name: Bug report
description: Report a calculation, import, display, or accessibility problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Describe the result you saw and the result you expected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include the smallest input dataset that reproduces the problem.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots are helpful, but remove private research data first.
